<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>퓨어데이 퍼즐</title>
<meta name="description" content="『조아름의 퓨어데이』 회차별 장면으로 맞추는 직소 퍼즐 — 쉬움 20·30조각, 고급 50·70조각">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 회차 고르기 -->
<section class="home" id="home">
  <header class="top">
    <div class="logo"><b>퓨어데이</b> 퍼즐<small>PUREDAY JIGSAW</small></div>
    <button class="icon" id="btnSound" aria-label="소리 끄기/켜기">🔊</button>
  </header>
  <p class="lead">웹툰 『조아름의 퓨어데이』 회차마다 네 장면이 퍼즐이 되었어요. 회차를 골라 보세요.</p>
  <div class="tabs" id="tabs"><button data-s="시즌1" class="on">시즌1</button><button data-s="시즌2">시즌2</button></div>
  <div class="grid" id="epGrid"></div>
  <p class="credit">그림 · 『조아름의 퓨어데이』 Godpainter · AI 활용 그림</p>
</section>

<!-- 장면·난이도 고르기 -->
<div class="modal" id="pick" hidden>
  <div class="sheet">
    <h2 id="pickTitle"></h2>
    <p class="sub">맞출 장면을 고르세요</p>
    <div class="scenes" id="scenes"></div>
    <span class="glabel">난이도</span>
    <div class="levels" id="levels">
      <button data-n="20"><b>20조각</b><small>쉬움</small></button>
      <button data-n="30"><b>30조각</b><small>쉬움+</small></button>
      <button data-n="50"><b>50조각</b><small>고급</small></button>
      <button data-n="70"><b>70조각</b><small>고급+</small></button>
    </div>
    <button class="primary" id="btnGo">퍼즐 시작</button>
    <button class="ghost" id="btnPickClose">닫기</button>
  </div>
</div>

<!-- 퍼즐 화면 -->
<section class="play" id="play" hidden>
  <div class="bar">
    <button class="icon" id="btnBack" aria-label="회차 고르기로">←</button>
    <div class="info"><b id="playTitle"></b><span id="playStat">0 / 20 · 0:00</span></div>
    <div class="tools">
      <button class="tool" id="btnGhost" title="밑그림 보기">🖼 밑그림</button>
      <button class="tool" id="btnEdge" title="테두리 조각만 보기">▢ 테두리</button>
      <button class="tool" id="btnHint" title="한 조각 맞춰 주기">💡</button>
      <button class="tool" id="btnPeek" title="완성 그림 잠깐 보기">👁</button>
    </div>
  </div>
  <canvas id="cv" aria-label="퍼즐 판"></canvas>
</section>

<!-- 완성 -->
<div class="modal" id="done" hidden>
  <div class="sheet">
    <h2>완성! 🎉</h2>
    <img id="doneImg" class="done-img" alt="완성된 장면">
    <p id="doneText"></p>
    <button class="primary" id="btnNextScene">다음 장면 ▶</button>
    <button class="ghost" id="btnDoneHome">다른 회차 고르기</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
