<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퓨어데이 체스</title>
<meta name="description" content="『퓨어데이』 캐릭터로 두는 캐주얼 체스 — 빛 진영과 드래곤 군단">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><b>퓨어데이</b> 체스<small>PUREDAY CHESS</small></div>
    <div class="top-btns">
      <button class="icon" id="btnSound" aria-label="소리 끄기/켜기" title="소리">🔊</button>
      <button class="icon" id="btnMenu" aria-label="메뉴" title="메뉴">☰</button>
    </div>
  </header>

  <section class="player" id="playerTop">
    <span class="side-dot dark"></span><span class="pname" id="nameTop">드래곤 군단</span>
    <span class="tray" id="trayTop" aria-label="잡은 말"></span>
  </section>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="체스판" role="grid"></div>
    <div class="layer" id="layer"></div>
  </div>

  <section class="player" id="playerBottom">
    <span class="side-dot light"></span><span class="pname" id="nameBottom">빛 진영</span>
    <span class="tray" id="trayBottom" aria-label="잡은 말"></span>
  </section>

  <div class="status" id="status" role="status">빛 진영 차례</div>

  <div class="bubble" id="bubble" aria-live="polite"><span class="who">페이</span><span id="bubbleText">어서 와요! 빛 진영이 먼저 둬요.</span></div>

  <nav class="controls">
    <button id="btnUndo">↶ 되돌리기</button>
    <button id="btnHint">💡 힌트</button>
    <button id="btnNew">새 게임</button>
  </nav>
</div>

<!-- 시작 메뉴 -->
<div class="modal" id="menu" hidden>
  <div class="sheet">
    <h1><b>퓨어데이</b> 체스</h1>
    <p class="sub">빛 진영과 드래곤 군단의 한판 승부</p>
    <div class="group"><span class="glabel">모드</span>
      <div class="seg" data-key="mode"><button data-v="ai" class="on">컴퓨터와</button><button data-v="pvp">둘이서</button></div></div>
    <div class="group" id="grpLevel"><span class="glabel">난이도</span>
      <div class="seg" data-key="level"><button data-v="easy">쉬움</button><button data-v="normal" class="on">보통</button><button data-v="hard">어려움</button></div></div>
    <div class="group" id="grpSide"><span class="glabel">내 진영</span>
      <div class="seg" data-key="side"><button data-v="w" class="on">빛 진영</button><button data-v="b">드래곤 군단</button></div></div>
    <button class="primary" id="btnStart">시작하기</button>
    <button class="ghost" id="btnResume" hidden>이어 하기</button>
    <p class="credit">캐릭터 · 『퓨어데이』 Godpainter · AI 활용 그림</p>
  </div>
</div>

<!-- 승진 선택 -->
<div class="modal" id="promo" hidden>
  <div class="sheet small">
    <h2>무엇으로 성장할까요?</h2>
    <div class="promo-row" id="promoRow"></div>
  </div>
</div>

<!-- 게임 끝 -->
<div class="modal" id="over" hidden>
  <div class="sheet">
    <h2 id="overTitle">승리!</h2>
    <p id="overText"></p>
    <button class="primary" id="btnAgain">한 판 더</button>
    <button class="ghost" id="btnOverMenu">메뉴로</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
