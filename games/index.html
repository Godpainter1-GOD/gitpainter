<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퓨어데이 게임 갤러리</title>
<meta name="description" content="『조아름의 퓨어데이』 캐릭터와 장면으로 만든 캐주얼 게임 모음 — 체스 · 장기 · 슈팅 · 포커 · 퍼즐 · 사다리">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 2026-10-21 대표님: "게임은 따로 웹에서 — 포털에서 게임 버튼을 누르면 새 창에서 게임만 갤러리처럼, 썸네일이나 버튼을 누르면 입장" */
:root{--paper:#f7f4ee;--card:#fffdf9;--ink:#24211c;--muted:#6f685c;--line:#ddd5c6;--gold:#b98a2c;--gold-d:#8f6a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
a{color:inherit}
header{padding:44px 16px 24px;text-align:center}
header small{letter-spacing:.3em;color:var(--muted);font-size:12px}
header h1{margin:8px 0 6px;font-family:"Noto Serif KR",Batang,serif;font-size:clamp(28px,6vw,40px)}
header h1 b{color:var(--gold)}
header p{margin:0 auto;max-width:560px;color:var(--muted);font-size:15px}
.back{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--card)}
.back:hover{border-color:var(--ink);color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.game{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.game:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,40,10,.14);border-color:var(--gold)}
.thumb{display:block;position:relative;aspect-ratio:3/2;overflow:hidden;background:#e9e4da}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.game:hover .thumb img{transform:scale(1.04)}
.thumb .play{position:absolute;inset:auto 12px 12px auto;background:rgba(20,16,10,.72);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:12px;color:var(--gold-d);border:1px solid currentColor;border-radius:3px;padding:0 8px}
.body h2{margin:0;font-family:"Noto Serif KR",Batang,serif;font-size:22px;line-height:1.3}
.body h2 em{font-style:normal;font-size:12px;color:var(--muted);font-family:"Noto Sans KR",sans-serif;margin-left:6px;letter-spacing:.05em}
.body p{margin:0;font-size:14px;color:#3d3830;flex:1}
.body .meta{font-size:12px;color:var(--muted)}
.enter{margin-top:8px;display:block;text-align:center;text-decoration:none;background:var(--gold);color:#fff;font-weight:700;font-size:16px;padding:11px 18px;border-radius:8px}
.enter:hover{background:var(--gold-d)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 16px 40px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <small>PUREDAY GAMES</small>
  <h1><b>퓨어데이</b> 게임 갤러리</h1>
  <p>웹툰 『조아름의 퓨어데이』 캐릭터와 장면으로 만든 게임들이에요. 그림이나 「입장」 버튼을 누르면 바로 시작해요.</p>
  <a class="back" href="../">← 웹툰 포털로</a>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>캐릭터·그림 · 『조아름의 퓨어데이』 Godpainter · AI 활용 그림</footer>
<script>
// 새 게임을 올리면 여기 한 줄 추가 (dir = 포털 안 폴더, 커버는 <dir>/assets/cover.jpg)
const GAMES = [
  { dir: "puzzle", tag: "퍼즐", title: "퓨어데이 퍼즐", en: "JIGSAW", meta: "시즌1·2 회차마다 네 장면 · 20~70조각", text: "웹툰 장면을 직소 퍼즐로 맞춰요. 밑그림·테두리·힌트 도우미가 있어요." },
  { dir: "ladder", tag: "사다리타기", title: "퓨어데이 사다리", en: "LADDER", meta: "최대 20명 · 사다리는 매번 무작위", text: "보상을 마음대로 적고 사다리를 타요. 당첨된 길은 빨간 선, 키보드로도 할 수 있어요." },
  { dir: "poker", tag: "포커", title: "퓨어데이 포커", en: "HOLD'EM", meta: "텍사스 홀덤 · 빛의 구슬(실제 돈 없음)", text: "조하임·김미아·라합·늑대개와 한 테이블에. '포커 배우기'와 페이의 조언이 도와줘요." },
  { dir: "shooter", tag: "슈팅", title: "빛의 화살", en: "SHOOTER", meta: "10단계 · 단계마다 중간보스 · 마지막은 대왕용", text: "조아름이 빛의 화살로 드래곤 군단을 물리쳐요. 화살은 자동으로 나가요." },
  { dir: "janggi", tag: "장기", title: "퓨어데이 장기", en: "JANGGI", meta: "빛 진영(초) vs 드래곤 군단(한)", text: "12사도가 신분 깃발을 들고 대왕용과 늑대개 군단에 맞서요. 컴퓨터와도, 둘이서도." },
  { dir: "chess", tag: "체스", title: "퓨어데이 체스", en: "CHESS", meta: "빛 진영 vs 드래곤 군단", text: "조성민 박사 킹, 조아름 퀸과 함께 큰 용의 드래곤 군단에 맞서요." },
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("grid").innerHTML = GAMES.map((g) => `
  <article class="game">
    <a class="thumb" href="../${g.dir}/" aria-label="${esc(g.title)} 입장"><img src="../${g.dir}/assets/cover.jpg" alt="${esc(g.title)}" loading="lazy"><span class="play">▶ 입장</span></a>
    <div class="body">
      <span class="tag">${esc(g.tag)}</span>
      <h2>${esc(g.title)}<em>${esc(g.en)}</em></h2>
      <div class="meta">${esc(g.meta)}</div>
      <p>${esc(g.text)}</p>
      <a class="enter" href="../${g.dir}/">입장</a>
    </div>
  </article>`).join("");
</script>
</body>
</html>
