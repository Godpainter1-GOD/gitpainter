<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>퓨어데이 핀볼</title>
<meta name="description" content="『조아름의 퓨어데이』 회차마다 4스테이지 — 회차 그림을 배경으로 튀기는 핀볼. 미션 핀을 모두 맞추면 캐릭터 스페셜 능력">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="cv" aria-label="핀볼 테이블"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="row1"><span id="stageName"></span><button id="btnPause" aria-label="일시정지">Ⅱ</button></div>
    <div class="row2"><b id="score">0</b><span id="target"></span></div>
    <div class="goal"><i id="goalBar"></i></div>
    <div class="row3"><span id="balls"></span><span id="pins"></span></div>
    <div class="ability" id="ability" hidden></div>
  </div>
  <button class="launch" id="btnLaunch" hidden><span class="knob">⇩</span><b>발사 핸들</b><small>꾹 누르거나 아래로 끌어 세기 조절 → 떼면 발사 · Space</small></button>
  <div class="touch" id="touchL"></div><div class="touch right" id="touchR"></div>
  <div class="screen" id="screen"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
