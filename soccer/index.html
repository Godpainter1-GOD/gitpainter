<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>퓨어데이 FC</title>
<meta name="description" content="『조아름의 퓨어데이』 축구 — 11대11 경기, 뉴팀을 창단해 마이 팀으로 키우는 커리어(전술·선수단·운영비·여름/겨울/FA 이적시장·트레이드), 친구와 온라인 1:1 대전">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="wrap" id="wrap">
  <div id="app" class="app"></div>
  <div id="matchView" class="match" hidden>
    <div class="mhud">
      <button id="btnPause" aria-label="일시정지">⏸</button>
      <div class="sb"><span class="tm" id="tA"></span><b id="sA">0</b><i>:</i><b id="sB">0</b><span class="tm" id="tB"></span></div>
      <span id="clock">0'</span>
    </div>
    <div class="pitch" id="pitch"><canvas id="cv" aria-label="경기 화면"></canvas><div class="banner" id="banner" hidden></div><div class="joy" id="joy" hidden><i></i></div></div>
    <div class="ctrl" id="ctrl">
      <div class="joyzone" id="joyzone"><span>여기를 누르고 끌어서 이동</span></div>
      <div class="btns">
        <button id="bLong" class="b long">롱패스</button>
        <button id="bSprint" class="b sprint">질주</button>
        <button id="bShoot" class="b shoot">슛</button>
        <button id="bPass" class="b pass">패스</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="modal" id="modal" hidden></div>
</div>
<script type="module" src="main.js?v=6"></script>
</body>
</html>
