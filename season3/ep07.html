<h1>첫 번째 전화</h1><div class="lead">이름을 말하고, 질문을 하고.<br>만나기 위한 첫 약속을 잡았다.</div></header><div class="scene-label">과거 · 한국</div><figure id="cut-1" class="splash left"><div class="art"><img loading="lazy" width="1024" height="350" src="../assets/pureday3/ep07/S3E07_C001_v1.webp" alt="1990년대 한국 도서관 게시판 앞 갈색 가방을 멘 지은아 옆모습"></div><figcaption class="narration">그 이름 앞에서, 은아는 조금 더 머물렀다.</figcaption><span class="cutno">01</span></figure><figure id="cut-2" class="insert left"><div class="art"><img loading="lazy" width="1024" height="276" src="../assets/pureday3/ep07/S3E07_C002_v1.webp" alt="하단 연락쪽지가 달린 평범한 종이 구인공고 확대, 읽히는 글자 없음"></div><figcaption class="narration">가정교사 겸 요리사. 한국 생활을 도와주실 분.</figcaption><span class="cutno">02</span></figure><figure id="cut-3" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="285" src="../assets/pureday3/ep07/S3E07_C003_v1.webp" alt="조심스러운 관심으로 공고를 자세히 읽는 지은아 큰 얼굴"></div><figcaption class="thought">가르치는 일과, 식사를 준비하는 일….</figcaption><span class="cutno">03</span></figure><figure id="cut-4" class="insert left tilt"><div class="art"><img loading="lazy" width="1024" height="181" src="../assets/pureday3/ep07/S3E07_C004_v1.webp" alt="절취선을 따라 연락쪽지 한 장만 조심히 떼는 지은아 손"></div><figcaption class="narration">찌익—</figcaption><span class="cutno">04</span></figure><figure id="cut-5" class="insert left pause"><div class="art"><img loading="lazy" width="1024" height="420" src="../assets/pureday3/ep07/S3E07_C005_v1.webp" alt="손바닥의 작은 연락쪽지를 보고 복도로 시선을 옮기는 지은아"></div><figcaption class="thought">먼저 물어보는 것부터.</figcaption><span class="cutno">05</span></figure><figure id="cut-6" class="splash left"><div class="art"><img loading="lazy" width="1024" height="284" src="../assets/pureday3/ep07/S3E07_C006_v1.webp" alt="나무 안내데스크로 걸어가는 지은아와 오래된 도서관 복도 원경"></div><figcaption class="narration">하지만 어디서부터 말을 꺼내야 할까.</figcaption><span class="cutno">06</span></figure><figure id="cut-7" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="370" src="../assets/pureday3/ep07/S3E07_C007_v1.webp" alt="안내데스크에서 여성 사서에게 조심스럽게 말하는 지은아"></div><figcaption class="speech">지은아: 저기… 전화할 수 있는 곳이 있을까요?</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="closeup right"><div class="art"><img loading="lazy" width="1024" height="207" src="../assets/pureday3/ep07/S3E07_C008_v1.webp" alt="단정한 밤색 단발 안경 회색 니트조끼 파란셔츠 사서가 데스크에서 들음"></div><figcaption class="speech">사서: 출입구 옆에 공중전화가 있어요.</figcaption><span class="cutno">08</span></figure><figure id="cut-9" class="closeup right"><div class="art"><img loading="lazy" width="1024" height="235" src="../assets/pureday3/ep07/S3E07_C009_v1.webp" alt="평범한 도서관 복도 쪽을 가리키는 사서, 게이트 없음"></div><figcaption class="speech">사서: 통화는 그쪽에서 하시면 됩니다.</figcaption><span class="cutno">09</span></figure><figure id="cut-10" class="closeup left pause"><div class="art"><img loading="lazy" width="1024" height="415" src="../assets/pureday3/ep07/S3E07_C010_v1.webp" alt="연락쪽지를 들고 고맙게 끄덕이는 지은아 작은 미소"></div><figcaption class="speech">지은아: 감사합니다.</figcaption><span class="cutno">10</span></figure><figure id="cut-11" class="insert left"><div class="art"><img loading="lazy" width="1024" height="287" src="../assets/pureday3/ep07/S3E07_C011_v1.webp" alt="연락쪽지를 확인하다 안내데스크의 메모지를 보는 지은아 손 확대"></div><figcaption class="narration">연락처 말고도 적어둘 것이 생길지 몰랐다.</figcaption><span class="cutno">11</span></figure><figure id="cut-12" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="237" src="../assets/pureday3/ep07/S3E07_C012_v1.webp" alt="사서에게 작은 메모지와 연필을 부탁하는 지은아"></div><figcaption class="speech">지은아: 메모지 한 장만 써도 될까요?</figcaption><span class="cutno">12</span></figure><figure id="cut-13" class="closeup right"><div class="art"><img loading="lazy" width="1024" height="380" src="../assets/pureday3/ep07/S3E07_C013_v1.webp" alt="무지 반쪽 종이와 평범한 나무 연필을 내미는 사서"></div><figcaption class="speech">사서: 네. 연필은 끝나고 돌려주세요.</figcaption><span class="cutno">13</span></figure><figure id="cut-14" class="insert left"><div class="art"><img loading="lazy" width="1024" height="165" src="../assets/pureday3/ep07/S3E07_C014_v1.webp" alt="양손으로 메모지와 연필을 받는 지은아 손 확대"></div><figcaption class="narration">도움을 구하면, 작은 길이 생겼다.</figcaption><span class="cutno">14</span></figure><figure id="cut-15" class="splash left pause"><div class="art"><img loading="lazy" width="1024" height="453" src="../assets/pureday3/ep07/S3E07_C015_v1.webp" alt="연락쪽지와 메모지 연필을 들고 도서관 현관 쪽으로 향하는 지은아"></div><figcaption class="narration">은아는 그 길을 따라갔다.</figcaption><span class="cutno">15</span></figure><div class="scene-label">도서관 현관</div><figure id="cut-16" class="splash left"><div class="art"><img loading="lazy" width="1024" height="338" src="../assets/pureday3/ep07/S3E07_C016_v1.webp" alt="조용한1990년대 도서관 현관 벽의 짙은 녹색 동전 공중전화, 은색키패드 짧은선반 검정꼬인줄 원경"></div><figcaption class="narration">창가 옆, 익숙한 전화기가 있었다.</figcaption><span class="cutno">16</span></figure><figure id="cut-17" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="210" src="../assets/pureday3/ep07/S3E07_C017_v1.webp" alt="공중전화 앞에 혼자 멈춰 갈색 가방끈을 만지는 지은아"></div><figcaption class="narration">돌아왔다는 사실이 조금 실감 났다.</figcaption><span class="cutno">17</span></figure><div class="duet"><figure id="cut-18" class="insert left"><div class="art"><img loading="lazy" width="1024" height="295" src="../assets/pureday3/ep07/S3E07_C018_v1.webp" alt="갈색 가방 속 작은 동전지갑을 여는 손 확대, 고서는 안쪽 천에 싸임"></div><figcaption class="thought">한 번만, 연락해보자.</figcaption><span class="cutno">18</span></figure><figure id="cut-19" class="insert left"><div class="art"><img loading="lazy" width="1024" height="242" src="../assets/pureday3/ep07/S3E07_C019_v1.webp" alt="공중전화의 좁은 선반에 메모지와 연락쪽지를 놓고 연필 준비"></div><figcaption class="narration">틀리지 않게, 천천히.</figcaption><span class="cutno">19</span></figure></div><figure id="cut-20" class="insert left pause"><div class="art"><img loading="lazy" width="1024" height="423" src="../assets/pureday3/ep07/S3E07_C020_v1.webp" alt="왼손으로 짙은 녹색 수
