="312" src="../assets/pureday3/ep06/S3E06_C013_v1.webp" alt="회상, 비 오는 창에 비친 두려운 지은아 얼굴, 초자연 형상 없음"></div><figcaption class="speech">지은아: 그런데… 제가 감당할 수 없을 것 같았어요.</figcaption><span class="cutno">13</span></figure><figure id="cut-14" class="insert right"><div class="art"><img loading="lazy" width="1024" height="208" src="../assets/pureday3/ep06/S3E06_C014_v1.webp" alt="회상, 같은 책상에서 떨리는 손으로 노트를 덮는 지은아"></div><figcaption class="speech">지은아: 잘못 들은 거라고, 잊으면 된다고 생각했어요.</figcaption><span class="cutno">14</span></figure><figure id="cut-15" class="splash left pause"><div class="art"><img loading="lazy" width="1024" height="473" src="../assets/pureday3/ep06/S3E06_C015_v1.webp" alt="회상, 유학생 방에서 짐 싼 무지 여행가방 옆 지은아"></div><figcaption class="narration">그래서 한국으로 돌아왔다.</figcaption><span class="cutno">15</span></figure><div class="scene-label">현재 · 미국</div><figure id="cut-16" class="closeup right"><div class="art"><img loading="lazy" width="1024" height="344" src="../assets/pureday3/ep06/S3E06_C016_v1.webp" alt="현재 미국 휴게실, 수치심과 참은 눈물의 베이지 카디건 지은아 큰 얼굴"></div><figcaption class="speech">지은아: 돌아온 게 아니라… 도망친 거였어요.</figcaption><span class="cutno">16</span></figure><figure id="cut-17" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="273" src="../assets/pureday3/ep06/S3E06_C017_v1.webp" alt="웃지 않고 진지하게 듣는 조아름 얼굴 확대"></div><figcaption class="narration">아름은 쉽게 괜찮다고 말하지 않았다.</figcaption><span class="cutno">17</span></figure><figure id="cut-18" class="insert right"><div class="art"><img loading="lazy" width="1024" height="225" src="../assets/pureday3/ep06/S3E06_C018_v1.webp" alt="갈색 치마 무릎 위 꽉 맞잡은 지은아 손 확대"></div><figcaption class="speech">지은아: 그 마음까지 없어질 줄 알았는데요.</figcaption><span class="cutno">18</span></figure><figure id="cut-19" class="closeup left"><div class="art"><img loading="lazy" width="1024" height="271" src="../assets/pureday3/ep06/S3E06_C019_v1.webp" alt="창밖을 보다가 다시 시선을 돌리는 복잡한 지은아 얼굴"></div><figcaption class="speech">지은아: 여기서도… 자꾸 그때가 떠올라요.</figcaption><
