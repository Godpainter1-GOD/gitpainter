tno">22</span></figure><figure id="cut-23" class="insert left"><div class="art"><img loading="lazy" width="724" height="227" src="../assets/pureday3/ep02/S3E02_C023_v1.webp" alt="첫부르심을떠올리는눈확대,실제환상없음"></div><figcaption class="narration">또 모른 척하게 될까.</figcaption><span class="cutno">23</span></figure><figure id="cut-24" class="closeup right"><div class="art"><img loading="lazy" width="724" height="468" src="../assets/pureday3/ep02/S3E02_C024_v1.webp" alt="교회의자에서고개숙인과거회상"></div><figcaption class="narration">준비가 되면 대답하겠다고 미뤘던 날.</figcaption><span class="cutno">24</span></figure><figure id="cut-25" class="closeup left pause"><div class="art"><img loading="lazy" width="724" height="564" src="../assets/pureday3/ep02/S3E02_C025_v1.webp" alt="문간에서가슴에손을대고불안해함"></div><figcaption class="thought">아직도 준비가 안 됐는데.</figcaption><span class="cutno">25</span></figure><div class="duet"><figure id="cut-26" class="insert right"><div class="art"><img loading="lazy" width="724" height="439" src="../assets/pureday3/ep02/S3E02_C026_v1.webp" alt="바람없는방에서살짝들리는고서페이지끝"></div><figcaption class="narration">사락.</figcaption><span class="cutno">26</span></figure><figure id="cut-27" class="insert left"><div class="art"><img loading="lazy" width="724" height="307" src="../assets/pureday3/ep02/S3E02_C027_v1.webp" alt="빗물맺힌닫힌창을보는지은아"></div><figcaption class="narration">창문은 닫혀 있었다.</figcaption><span class="cutno">27</span></figure></div><figure id="cut-28" class="regular right"><div class="art"><img loading="lazy" width="724" height="437" src="../assets/pureday3/ep02/S3E02_C028_v1.webp" alt="탁자위빈목록카드는움직이지않음"></div><figcaption class="narration">다른 종이는 움직이지 않았다.</figcaption><span class="cutno">28</span></figure><figure id="cut-29" class="closeup left"><div class="art"><img loading="lazy" width="724" height="446" src="../assets/pureday3/ep02/S3E02_C029_v1.webp" alt="아직들어가지않고문간에서몸기울여살핌"></div><figcaption class="thought">내가 잘못 본 걸까.</figcaption><span class="cutno">29</span></figure><figure id="cut-30" class="ins
