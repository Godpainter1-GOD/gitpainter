}footer{text-align:center;padding:60px 20px 90px;line-height:2;background:#f2eee4}footer a{color:#536a4c}.top{position:fixed;right:18px;bottom:18px;padding:12px;background:#344d40;color:#fff;text-decoration:none;font-size:12px;border-radius:3px}.bookmark{background:transparent;border:1px solid #b4c5ab;color:#fff8e9;padding:8px 14px;font:inherit;margin-top:20px;cursor:pointer}@media(max-width:600px){header{padding:45px 7% 55px}.speech{font-size:17px;padding:13px 17px}.narration{font-size:17px;line-height:1.95}.duet{gap:10px;padding:0 4%}.duet .speech{font-size:15px;padding:12px}.duet .narration{font-size:15px}.top{right:10px;bottom:10px}.pause{margin-bottom:95px}}.speech.left{margin-left:4%;margin-right:auto}.speech.right{margin-left:auto;margin-right:4%}.speech.left:before{left:28%}.speech.right:before{left:68%}</style></head><body id="top"><main class="reader"><header><a href="https://godpainter1-god.github.io/gitpainter/specials/pureday-episode3/">← 김미아 특별관</a><p>PUREDAY EPISODE 03 · EPISODE 01</p><h1>서툰 영어,<br>열린 마음</h1><div class="intro">제1화 · 75컷 · 검토본<br>말은 서툴렀지만, 마음을 듣는 일까지 낯선 것은 아니었다.</div></header><div class="scene">낯선 아침</div><figure id="cut-1" class="splash"><div class="art"><img fetchpriority="high" width="1024" height="269" src="assets/ep01/MIA_E01_C001_v1.webp" alt="낯선 아침"></div><figcaption class="narration">미국에서 맞는 첫 등굣날. 아침부터 모든 소리가 낯설었다.</figcaption><span class="cutno">01</span></figure><figure id="cut-2" class="close"><div class="art"><img loading="lazy" width="1024" height="231" src="assets/ep01/MIA_E01_C002_v1.webp" alt="낯선 아침"></div><figcaption class="speech">미아: 배가 안 고픈데… 학교 가면 배고파지겠죠?</figcaption><span class="cutno">02</span></figure><figure id="cut-3" class="close right"><div class="art"><img loading="lazy" width="1024" height="356" src="assets/ep01/MIA_E01_C003_v1.webp" alt="낯선 아침"></div><figcaption class="speech">엄마: 그럴 때 먹으라고 준비했지.</figcaption><span class="cutno">03</span></figure><figure id="cut-4" class="close"><div class="art"><img loading="lazy" width="1024" height="244" src="assets/ep01/MIA_E01_C004_v1.webp" alt="낯선 아침"></div><figcaption class="speech left">아빠: 모르면 한 번 더 물어봐도 돼. 첫날이잖아.</figcaption><span class="cutno">04</span></figure><figure id="cut-5" class="close right"><div class="art"><img loading="lazy" width="1024" height="386" src="assets/ep01/MIA_E01_C005_v1.webp" alt="낯선 아침"></div><figcaption class="narration">한 번 더. 그 말부터 가방에 넣었다.</figcaption><span class="cutno">05</span></figure><div class="scene">학교 앞</div><figure id="cut-6" class="splash"><div class="art"><img loading="lazy" width="1024" height="308" src="assets/ep01/MIA_E01_C006_v1.webp" alt="학교 앞"></div><figcaption class="narration">교문 대신 넓은 출입문. 복도에는 모르는 얼굴들이 흘러갔다.</figcaption><span class="cutno">06</span></figure><div class="duet"><figure id="cut-7" class="insert"><div class="art"><img loading="lazy" width="1024" height="245" src="assets/ep01/MIA_E01_C007_v1.webp" alt="학교 앞"></div><figcaption class="narration">시간표는 손에 있었지만, 어디로 가야 할지는 잘 몰랐다.</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="close"><div class="art"><img loading="lazy" width="1024" height="332" src="assets/ep01/MIA_E01_C008_v1.webp" alt="학교 앞"></div><figcaption class="speech right">아빠: 여기서부터는 네가 가보고 싶은 만큼 가보자.</figcaption><span class="cutno">08</span></figure></div><figure id="cut-9" class="close right"><div class="art"><img loading="lazy" width="1024" height="260" src="assets/ep01/MIA_E01_C009_v1.webp" alt="학교 앞"></div><figcaption class="speech">미아: 끝나고 연락할게요.</figcaption><span class="cutno">09</span></figure><figure id="cut-10" class="regular pause"><div class="art"><img loading="lazy" width="1024" height="350" src="assets/ep01/MIA_E01_C010_v1.webp" alt="학교 앞"></div><figcaption class="narration">문을 지나자, 아버지의 목소리가 조금 멀어졌다.</figcaption><span class="cutno">10</span></figure><div class="scene">첫 인사</div><figure id="cut-11" class="splash"><div class="art"><img loading="lazy" width="1024" height="255" src="assets/ep01/MIA_E01_C011_v3.webp" alt="첫 인사"></div><figcaption class="speech left">레이첼 모건 선생님: 미아, 맞지? 오늘 학교생활은 내가 도와줄게.</figcaption><span class="cutno">11</span></figure><figure id="cut-12" class="close"><div class="art"><img loading="lazy" width="1024" height="261" src="assets/ep01/MIA_E01_C012_v3.webp" alt="첫 인사"></div><figcaption class="narration">미아는 알아들은 단어를 조심스럽게 이어 붙였다.</figcaption><span class="cutno">12</span></figure><figure id="cut-13" class="close right"><div class="art"><img loading="lazy" width="1024" height="318" src="assets/ep01/MIA_E01_C013_v3.webp" alt="첫 인사"></div><figcaption class="speech">미아: Hi… I’m Mia. 한국에서 왔어요.</figcaption><span class="cutno">13</span></figure><figure id="cut-14" class="close"><div class="art"><img loading="lazy" width="1024" height="288" src="assets/ep01/MIA_E01_C014_v3.webp" alt="첫 인사"></div><figcaption class="speech">친구들: Hi, Mia!</figcaption><span class="cutno">14</span></figure><figure id="cut-15" class="close right"><div class="art"><img loading="lazy" width="1024" height="382" src="assets/ep01/MIA_E01_C015_v3.webp" alt="첫 인사"></div><figcaption class="narration">이름 하나는, 통역 없이도 닿았다.</figcaption><span class="cutno">15</span></figure><div class="scene">앉을 자리</div><figure id="cut-16" class="close"><div class="art"><img loading="lazy" width="1024" height="341" src="assets/ep01/MIA_E01_C016_v3.webp" alt="앉을 자리"></div><figcaption class="speech left">레이첼 모건 선생님: 저쪽 빈자리에 앉을래? 모르는 건 언제든 물어봐.</figcaption><span class="cutno">16</span></figure><figure id="cut-17" class="close right"><div class="art"><img loading="lazy" width="1024" height="277" src="assets/ep01/MIA_E01_C017_v3.webp" alt="앉을 자리"></div><figcaption class="speech right">클로이 베넷: 여기, 비워뒀어.</figcaption><span class="cutno">17</span></figure><div class="duet"><figure id="cut-18" class="regular"><div class="art"><img loading="lazy" width="1024" height="256" src="assets/ep01/MIA_E01_C018_v3.webp" alt="앉을 자리"></div><figcaption class="narration">조심할수록 손끝이 더 바빠졌다.</figcaption><span class="cutno">18</span></figure><figure id="cut-19" class="close right"><div class="art"><img loading="lazy" width="1024" height="241" src="assets/ep01/MIA_E01_C019_v3.webp" alt="앉을 자리"></div><figcaption class="speech">미아: Sorry!</figcaption><span class="cutno">19</span></figure></div><figure id="cut-20" class="close"><div class="art"><img loading="lazy" width="1024" height="375" src="assets/ep01/MIA_E01_C020_v3.webp" alt="앉을 자리"></div><figcaption class="speech right">클로이 베넷: 괜찮아. 연필도 첫날이라 긴장했나 봐.</figcaption><span class="cutno">20</span></figure><div class="scene">빠른 말들</div><figure id="cut-21" class="regular"><div class="art"><img loading="lazy" width="1024" height="292" src="assets/ep01/MIA_E01_C021_v3.webp" alt="빠른 말들"></div><figcaption class="narration">수업이 시작되자, 문장들은 미아의 연습보다 빨랐다.</figcaption><span class="cutno">21</span></figure><figure id="cut-22" class="insert"><div class="art"><img loading="lazy" width="1024" height="254" src="assets/ep01/MIA_E01_C022_v3.webp" alt="빠른 말들"></div><figcaption class="narration">알고 있는 단어 뒤로, 모르는 문장이 지나갔다.</figcaption><span class="cutno">22</span></figure><figure id="cut-23" class="close right"><div class="art"><img loading="lazy" width="1024" height="310" src="assets/ep01/MIA_E01_C023_v3.webp" alt="빠른 말들"></div><figcaption class="speech">미아: Could you… say that again?</figcaption><span class="cutno">23</span></figure><figure id="cut-24" class="close"><div class="art"><img loading="lazy" width="1024" height="251" src="assets/ep01/MIA_E01_C024_v3.webp" alt="빠른 말들"></div><figcaption class="speech left">레이첼 모건 선생님: 물론이지! 천천히 다시 설명해줄게. 편하게 물어봐.</figcaption><span class="cutno">24</span></figure><figure id="cut-25" class="regular"><div class="art"><img loading="lazy" width="1024" height="390" src="assets/ep01/MIA_E01_C025_v3.webp" alt="빠른 말들"></div><figcaption class="narration">못 알아들었다는 말도, 대화를 이어가는 말이었다.</figcaption><span class="cutno">25</span></figure><div class="scene">복도의 작은 오해</div><figure id="cut-26" class="splash"><div class="art"><img loading="lazy" width="1024" height="314" src="assets/ep01/MIA_E01_C026_v1.webp" alt="복도의 작은 오해"></div><figcaption class="speech left">노아 밀러: 다음 수업 어디야?</figcaption><span class="cutno">26</span></figure><div class="duet"><figure id="cut-27" class="close right"><div class="art"><img loading="lazy" width="1024" height="277" src="assets/ep01/MIA_E01_C027_v1.webp" alt="복도의 작은 오해"></div><figcaption class="speech">미아: 음… next class… 저쪽?</figcaption><span class="cutno">27</span></figure><figure id="cut-28" class="close"><div class="art"><img loading="lazy" width="1024" height="279" src="assets/ep01/MIA_E01_C028_v1.webp" alt="복도의 작은 오해"></div><figcaption class="speech left">노아 밀러: 그쪽은 체육관이야.</figcaption><span class="cutno">28</span></figure></div><figure id="cut-29" class="close right"><div class="art"><img loading="lazy" width="1024" height="266" src="assets/ep01/MIA_E01_C029_v1.webp" alt="복도의 작은 오해"></div><figcaption class="speech right">미아: 그럼 벌써 운동부터 시작할 뻔했네.</figcaption><span class="cutno">29</span></figure><figure id="cut-30" class="regular pause"><div class="art"><img loading="lazy" width="1024" height="367" src="assets/ep01/MIA_E01_C030_v1.webp" alt="복도의 작은 오해"></div><figcaption class="narration">서툰 말 사이에, 작은 농담이 길을 만들었다.</figcaption><span class="cutno">30</span></figure><div class="scene">점심시간</div><figure id="cut-31" class="splash"><div class="art"><img loading="lazy" width="1024" height="279" src="assets/ep01/MIA_E01_C031_v3.webp" alt="점심시간"></div><figcaption class="narration">점심시간에는 의자보다 빈자리를 찾는 일이 더 어려웠다.</figcaption><span class="cutno">31</span></figure><figure id="cut-32" class="close"><div class="art"><img loading="lazy" width="1024" height="300" src="assets/ep01/MIA_E01_C032_v3.webp" alt="점심시간"></div><figcaption class="narration">아는 말이 없어서가 아니라, 언제 끼어들어야 할지 몰라서.</figcaption><span class="cutno">32</span></figure><figure id="cut-33" class="close right"><div class="art"><img loading="lazy" width="1024" height="280" src="assets/ep01/MIA_E01_C033_v3.webp" alt="점심시간"></div><figcaption
