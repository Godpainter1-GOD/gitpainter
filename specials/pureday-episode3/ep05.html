rration">첫 뷰티 영상에 필요한 것은 작은 거울과 솔직한 얼굴이었다.</figcaption><span class="cutno">01</span></figure><figure id="cut-2" class="close"><div class="art"><img loading="lazy" width="1024" height="287" src="assets/ep05/MIA_E05_C002_v1.webp" alt="거울 하나의 시작"></div><figcaption class="speech left">미아: 오늘은 제가 쓰는 걸 보여드릴게요. 전문가인 척은 못 하고요.</figcaption><span class="cutno">02</span></figure><figure id="cut-3" class="insert"><div class="art"><img loading="lazy" width="1024" height="263" src="assets/ep05/MIA_E05_C003_v1.webp" alt="거울 하나의 시작"></div><figcaption class="narration">제품 이름보다 먼저, 왜 손이 갔는지를 적었다.</figcaption><span class="cutno">03</span></figure><figure id="cut-4" class="close"><div class="art"><img loading="lazy" width="1024" height="297" src="assets/ep05/MIA_E05_C004_v1.webp" alt="거울 하나의 시작"></div><figcaption class="speech left">미아: 입술이 불편하면 말도 자꾸 조심하게 되더라고요.</figcaption><span class="cutno">04</span></figure><figure id="cut-5" class="regular"><div class="art"><img loading="lazy" width="1024" height="380" src="assets/ep05/MIA_E05_C005_v1.webp" alt="거울 하나의 시작"></div><figcaption class="narration">거울 앞에서도 말투는 조금 서툴렀다.</figcaption><span class="cutno">05</span></figure><div class="scene">다른 피부 다른 질문</div><figure id="cut-6" class="close"><div class="art"><img loading="lazy" width="1024" height="316" src="assets/ep05/MIA_E05_C006_v1.webp" alt="다른 피부 다른 질문"></div><figcaption class="speech left">클로이 베넷: 나한테는 이 색이 좀 다르게 보여.</figcaption><span class="cutno">06</span></figure><div class="duet"><figure id="cut-7" class="close right"><div class="art"><img loading="lazy" width="1024" height="270" src="assets/ep05/MIA_E05_C007_v1.webp" alt="다른 피부 다른 질문"></div><figcaption class="speech right">미아: 내 얼굴에서 보이는 게 전부는 아니구나.</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="close"><div class="art"><img loading="lazy" width="1024" height="322" src="assets/ep05/MIA_E05_C008_v1.webp" alt="다른 피부 다른 질문"></div><figcaption class="speech left">클로이 베넷: 조명만 달라도 다르잖아.</figcaption><span class
