figure><figure id="cut-2" class="regular"><div class="art"><img loading="lazy" width="1024" height="295" src="assets/ep12/MIA_E12_C002_v3.webp" alt="라 플라뉴 · 결승"></div><figcaption class="narration">열네 번째 커브. 썰매가 크게 흔들렸다.</figcaption><span class="cutno">02</span></figure><figure id="cut-3" class="regular"><div class="art"><img loading="lazy" width="1024" height="298" src="assets/ep12/MIA_E12_C003_v3.webp" alt="라 플라뉴 · 결승"></div><figcaption class="narration">썰매가 전복됐다. 미아에게는 그 순간이 끝없이 길게 느껴졌다.</figcaption><span class="cutno">03</span></figure><figure id="cut-4" class="regular"><div class="art"><img loading="lazy" width="1024" height="284" src="assets/ep12/MIA_E12_C004_v3.webp" alt="라 플라뉴 · 결승"></div><figcaption class="narration">하임의 글래스 너머로 하얀 날개가 썰매를 덮었다. 리웨이가 꿈에서 보았던 모습이었다.</figcaption><span class="cutno">04</span></figure><figure id="cut-5" class="regular"><div class="art"><img loading="lazy" width="1024" height="323" src="assets/ep12/MIA_E12_C005_v3.webp" alt="라 플라뉴 · 결승"></div><figcaption class="speech left">미아: 마이클…!</figcaption><span class="cutno">05</span></figure><div class="scene">그를 살린 손들</div><figure id="cut-6" class="splash"><div class="art"><img loading="lazy" width="1024" height="323" src="assets/ep12/MIA_E12_C006_v3.webp" alt="그를 살린 손들"></div><figcaption class="narration">미아는 조성민 박사를 데리고 의료진이 있는 곳으로 달려갔다.</figcaption><span class="cutno">06</span></figure><figure id="cut-7" class="regular"><div class="art"><img loading="lazy" width="1024" height="301" src="assets/ep12/MIA_E12_C007_v3.webp" alt="그를 살린 손들"></div><figcaption class="narration">스캐너는 부상을 찾아냈지만 주치의의 손에서는 약물 주입이 시작되지 않았다.</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="regular"><div class="art"><img loading="lazy" width="1024" height="288" src="assets/ep12/MIA_E12_C008_v3.webp" alt="그를 살린 손들"></div><figcaption class="narration">박사가 캐털린에게 건넨 스캐너가 그녀의 손에서 처음으로 환하게 켜졌다.</figcaption><span class="cutno">08</span></figure><figure id="cut-9" class="regular"><div class="art"><img loading="lazy" width="1024" height="288" src="assets/ep12/MIA_E12_C009_v3.webp" alt="그를 살린 손들"></div><figcaption class="narration">의료진의 손과 펜스 너머의 기도. 미아는 그 순간을 평생 잊지 못했다.</figcaption><span class="cutno">09</span></figure><figure id="cut-10" class="insert"><div class="art"><img loading="lazy" width="1024" height="291" src="assets/ep12/MIA_E12_C010_v3.webp" alt="그를 살린 손들"></div><figcaption class="speech left">캐털린: 맥박이 돌아와요… 수치가 안정됐어요!</figcaption><span class="cutno">10</span></figure><div class="scene">병실에서 이어진 약속</div><figure id="cut-11" class="splash"><div class="art"><img loading="lazy" width="1024" height="306" src="assets/ep12/MIA_E12_C011_v3.webp" alt="병실에서 이어진 약속"></div><figcaption class="narration">그날 저녁. 병실에서 마이클의 숨소리를 다시 들을 수 있었다.</figcaption><span class="cutno">11</span></figure><figure id="cut-12" class="close"><div class="art"><img loading="lazy" width="1024" height="298" src="assets/ep12/MIA_E12_C012_v3.webp" alt="병실에서 이어진 약속"></div><figcaption class="speech left">마이클: 그때 봤어요. 아름 씨에게… 빛나는 갑옷이 있었어요.</figcaption><span class="cutno">12</span></figure><figure id="cut-13" class="regular"><div class="art"><img loading="lazy" width="1024" height="300" src="assets/ep12/MIA_E12_C013_v3.webp" alt="병실에서 이어진 약속"></div><figcaption class="speech left">미아: 당신을 살리려고 모두가 힘을 모았어요. 나도, 그분들도요.</figcaption><span class="cutno">13</span></figure><figure id="cut-14" class="regular"><div class="art"><img loading="lazy" width="1024" height="296" src="assets/ep12/MIA_E12_C014_v3.webp" alt="병실에서 이어진 약속"></div><figcaption class="speech left">미아: 퓨어데이에 필요한 일이라면, 제가 할 수 있는 것부터 도울게요.</figcaption><span class="cutno">14</span></figure><figure id="cut-15" class="regular"><div class="art"><img loading="lazy" width="1024" height="305" src="assets/ep12/MIA_E12_C015_v3.webp" alt="병실에서 이어진 약속"></div><figcaption class="narration">사고는 끝이 아니었다. 미아는 그날의 약속을 일상에서도 이어가기로 했다.</figcaption><span class="cutno">15</span></figure><div class="scene">지금의 자리</div><figure id="cut-16" class="splash"><div class="art"><img loading="lazy" width="1024" height="342" src="assets/ep12/MIA_E12_C016_v3.webp" alt="지금의 자리"></div><figcaption class="narration">회사는 이제 미아 혼자 시작했던 방보다 훨씬 커져 있었다.</figcaption><span class="cutno">16</span></figure><figure id="cut-17" class="regular"><div class="art"><img loading="lazy" width="1024" height="293" src="assets/ep12/MIA_E12_C017_v3.webp" alt="지금의 자리"></div><figcaption class="narration">질문을 이어받을 사람이 생겼고,</figcaption><span class="cutno">17</span></figure><figure id="cut-18" class="regular"><div class="art"><img loading="lazy" width="1024" height="293" src="assets/ep12/MIA_E12_C018_v3.webp" alt="지금의 자리"></div><figcaption class="narration">결정을 나눌 팀도 자라고 있었다.</figcaption><span class="cutno">18</span></figure><figure id="cut-19" class="regular"><div class="art"><img loading="lazy" width="1024" height="278" src="assets/ep12/MIA_E12_C019_v3.webp" alt="지금의 자리"></div><figcaption class="speech left">에이미 카터: 이 부분은 저희 팀에서 맡아 진행해도 될까요?</figcaption><span class="cutno">19</span></figure><figure id="cut-20" class="close"><div class="art"><img loading="lazy" width="1024" height="293" src="assets/ep12/MIA_E12_C020_v3.webp" alt="지금의 자리"></div><figcaption class="speech left">미아: 네. 먼저 여러분 계획을 들려주세요.</figcaption><span class="cutno">20</span></figure><div class="scene">남겨두는 것이 아니라</div><figure id="cut-21" class="splash"><div class="art"><img loading="lazy" width="1024" height="340" src="assets/ep12/MIA_E12_C021_v3.webp" alt="남겨두는 것이 아니라"></div><figcaption class="speech left">미아: 새로운 일에 합류하는 것을 고민하고 있어요.</figcaption><span class="cutno">21</span></figure><figure id="cut-22" class="close"><div class="art"><img loading="lazy" width="1024" height="293" src="assets/ep12/MIA_E12_C022_v3.webp" alt="남겨두는 것이 아니라"></div><figcaption class="speech left">다니엘 모랄레스: 운영을 어떻게 나눌지부터 같이 정하죠.</figcaption><span class="cutno">22</span></figure><figure id="cut-23" class="regular"><div class="art"><img loading="lazy" width="1024" height="295" src="assets/ep12/MIA_E12_C023_v3.webp" alt="남겨두는 것이 아니라"></div><figcaption class="speech left">미아: 여러분에게 갑자기 짐을 넘기고 싶지는 않습니다.</figcaption><span class="cutno">23</span></figure><figure id="cut-24" class="regular"><div class="art"><img loading="lazy" width="1024" height="279" src="assets/ep12/MIA_E12_C024_v3.webp" alt="남겨두는 것이 아니라"></div><figcaption class="speech left">나디아 브룩스: 그래서 지금 함께 준비할 수 있는 거잖아요.</figcaption><span class="cutno">24</span></figure><figure id="cut-25" class="insert"><div class="art"><img loading="lazy" width="1024" height="287" src="assets/ep12/MIA_E12_C025_v3.webp" alt="남겨두는 것이 아니라"></div><figcaption class="narration">믿고 맡기는 일도 책임을 놓는 일과는 달랐다.</figcaption><span class="cutno">25</span></figure><div class="scene">배워온 방식대로</div><figure id="cut-26" class="splash"><div class="art"><img loading="lazy" width="1024" height="338" src="assets/ep12/MIA_E12_C026_v3.webp" alt="배워온 방식대로"></div><figcaption class="narration">결정할 범위와 보고할 일, 긴급할 때 연락할 방법을 정했다.</figcaption><span class="cutno">26</span></figure><figure id="cut-27" class="regular"><div class="art"><img loading="lazy" width="1024" height="298" src="assets/ep12/MIA_E12_C027_v3.webp" alt="배워온 방식대로"></div><figcaption class="speech left">미아: 제가 빠지면 가장 먼저 막히는 곳이 어디인가요?</figcaption><span class="cutno">27</span></figure><figure id="cut-28" class="regular"><div class="art"><img loading="lazy" width="1024" height="283" src="assets/ep12/MIA_E12_C028_v3.webp" alt="배워온 방식대로"></div><figcaption class="speech left">다니엘 모랄레스: 여기부터 나눠보면 됩니다.</figcaption><span class="cutno">28</span></figure><figure id="cut-29" class="regular"><div class="art"><img loading="lazy" width="1024" height="291" src="assets/ep12/MIA_E12_C029_v3.webp" alt="배워온 방식대로"></div><figcaption class="narration">성장할 때 배운 질문이 다음 선택을 도왔다.</figcaption><span class="cutno">29</span></figure><figure id="cut-30" class="regular"><div class="art"><img loading="lazy" width="1024" height="290" src="assets/ep12/MIA_E12_C030_v3.webp" alt="배워온 방식대로"></div><figcaption class="narration">대신해줄 사람이 아니라 함께 책임질 사람들을 믿었다
