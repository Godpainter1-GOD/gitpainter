5" class="close right"><div class="art"><img loading="lazy" width="1024" height="346" src="assets/prologue/MIA_P_C005_v1.webp" alt="학교 아침"></div><figcaption class="speech">미아: 결말이 궁금해서. 딱 한 장만 더 보려고 했는데.</figcaption><span class="cutno">05</span></figure><div class="scene">교실의 꿈</div><figure id="cut-6" class="insert"><div class="art"><img loading="lazy" width="1024" height="311" src="assets/prologue/MIA_P_C006_v1.webp" alt="교실의 꿈"></div><figcaption class="narration">수업이 시작되기 전, 선생님이 질문 하나를 남겼다.</figcaption><span class="cutno">06</span></figure><figure id="cut-7" class="close right"><div class="art"><img loading="lazy" width="1024" height="246" src="assets/prologue/MIA_P_C007_v1.webp" alt="교실의 꿈"></div><figcaption class="speech">선생님: 앞으로 꼭 해보고 싶은 일을 적어볼까요?</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="regular"><div class="art"><img loading="lazy" width="1024" height="330" src="assets/prologue/MIA_P_C008_v1.webp" alt="교실의 꿈"></div><figcaption class="narration">내 목소리로, 누군가에게 힘이 되는 일.</figcaption><span class="cutno">08</span></figure><figure id="cut-9" class="close right"><div class="art"><img loading="lazy" width="1024" height="274" src="assets/prologue/MIA_P_C009_v1.webp" alt="교실의 꿈"></div><figcaption class="speech">친구: 너라면 진짜 잘할 것 같아.</figcaption><span class="cutno">09</span></figure><figure id="cut-10" class="close"><div class="art"><img loading="lazy" width="1024" height="334" src="assets/prologue/MIA_P_C010_v1.webp" alt="교실의 꿈"></div><figcaption class="speech">미아: 아직은… 연습 중이야.</figcaption><span class="cutno">10</span></figure><div class="scene">복도에서 들은 마음</div><figure id="cut-11" class="splash"><div class="art"><img loading="lazy" width="1024" height="303" src="assets/prologue/MIA_P_C011_v1.webp" alt="복도에서 들은 마음"></div><figcaption class="narration">많은 말이 오가는 복도에도, 말없이 남는 마음이 있었다.</figcaption><span class="cutno">11</span></figure><figure id="cut-12" class="regular"><div class="art"><img loading="lazy" width="1024" height="312" src="asse
