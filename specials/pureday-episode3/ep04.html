n class="speech left">엄마: 오늘은 어디가 제일 불편해?</figcaption><span class="cutno">04</span></figure><figure id="cut-5" class="close right"><div class="art"><img loading="lazy" width="1024" height="343" src="assets/ep04/MIA_E04_C005_v1.webp" alt="회복 중의 아침"></div><figcaption class="speech right">미아: 다리도요. 마음도요.</figcaption><span class="cutno">05</span></figure><div class="scene">작은 약속</div><figure id="cut-6" class="close"><div class="art"><img loading="lazy" width="1024" height="366" src="assets/ep04/MIA_E04_C006_v1.webp" alt="작은 약속"></div><figcaption class="speech left">엄마: 둘 중 하나만 말해도 돼.</figcaption><span class="cutno">06</span></figure><div class="duet"><figure id="cut-7" class="close right"><div class="art"><img loading="lazy" width="1024" height="253" src="assets/ep04/MIA_E04_C007_v1.webp" alt="작은 약속"></div><figcaption class="speech right">미아: 뭐라도 해야 할 것 같아서 더 못 하겠어요.</figcaption><span class="cutno">07</span></figure><figure id="cut-8" class="close"><div class="art"><img loading="lazy" width="1024" height="288" src="assets/ep04/MIA_E04_C008_v1.webp" alt="작은 약속"></div><figcaption class="speech left">엄마: 그럼 오늘 할 일은 한 칸만 두자.</figcaption><span class="cutno">08</span></figure></div><figure id="cut-9" class="close right"><div class="art"><img loading="lazy" width="1024" height="307" src="assets/ep04/MIA_E04_C009_v1.webp" alt="작은 약속"></div><figcaption class="speech right">미아: 녹음 파일 열어보기. 그것만요.</figcaption><span class="cutno">09</span></figure><figure id="cut-10" class="regular pause"><div class="art"><img loading="lazy" width="1024" height="287" src="assets/ep04/MIA_E04_C010_v1.webp" alt="작은 약속"></div><figcaption class="narration">시작은 방송이 아니라 파일 하나를 여는 일이었다.</figcaption><span class="cutno">10</span></figure><div class="scene">남아 있는 목소리</div><figure id="cut-11" class="splash"><div class="art"><img loading="lazy" width="1024" height="301" src="assets/ep04/MIA_E04_C011_v1.webp" alt="남아 있는 목소리"></div><figcaption class="narration">처음 녹음했던 목소리는 생각보다 밝았다.</figcaption><span class="cutn
